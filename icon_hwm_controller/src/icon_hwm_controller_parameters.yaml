icon_hwm_controller:
  
  name: {
    type: string,
    default_value: "",
    description: "The ICON hardware module name that this Controller uses to talk to the ICON service. The name has to be unique across all hardware module instances that are connecting to the same ICON instance.

    Shared memory modules are indexed by this name.",
    read_only: true,
    validation: {
      not_empty<>: null
    }
  }
  shm_namespace: {
    type: string,
    default_value: "",
    description: "The shared memory namespace. If empty, uses the default namespace."
  }
  lock_memory: {
    type: bool,
    default_value: false,
    description: "Whether or not to lock the memory in realtime threads that this controller spawns. On non-realtime kernels, this option has no effect."
  }
  cpu_affinity: {
    type: int_array,
    default_value: [0],
    description: "The CPU core(s) to pin the controller to. Defaults to [0]. If explicitly set to empty ([]), the controller will not be pinned to any CPU core."
  }
  realtime_priority_low: {
    type: int,
    default_value: -1,
    description: "The realtime priority of the controller's low priority threads. If -1, all controller threads will run at default priority."
  }
  realtime_priority_high: {
    type: int,
    default_value: -1,
    description: "The realtime priority of the controller's high priority threads. If -1, all controller threads will run at default priority."
  }
  context_name: {
    type: string,
    default_value: "",
    description: "The context name. Used for error reporting. This is typically the instance name of the module under which the hardware module is shown in Flowstate.

    If omitted, this defaults to `name`.",
    read_only: true
  }
  drives_realtime_clock: {
    type: bool,
    default_value: true,
    description: "Does this hardware module drive ICON's realtime clock? If true, then the hardware module's Init method will be provided a RealtimeClockInterface (via module_config.GetRealtimeClock()), and the hardware module is expected to call TickBlocking every control cycle. Will fail if false."
  }
  dof_names: {
    type: string_array,
    default_value: [],
    description: "Specifies dof_names or axes used by the controller.",
    read_only: true,
    validation: {
      unique<>: null,
      not_empty<>: null,
    }
  }
  command_interfaces: {
    type: string_array,
    default_value: ["position", "velocity"],
    description: "Names of the interfaces used by the controller for writing commands to the hardware. Usually position, velocity.",
    read_only: true,
    validation: {
      not_empty<>: null,
      size_gt<>: 0,
      size_lt<>: 3,
    }
  }
  reference_and_state_interfaces: {
    type: string_array,
    default_value: ["position", "velocity"],
    description: "Name of the interfaces used by the controller getting hardware states and reference commands. The second interface should be the derivative of the first.",
    read_only: true,
    validation: {
      not_empty<>: null,
      size_gt<>: 0,
      size_lt<>: 3,
    }
  }
  hardware_component_name: {
    type: string,
    default_value: "",
    description: "The name of the ros2_control hardware component to manage lifecycle for."
  }
  controllers_to_activate: {
    type: string_array,
    default_value: [],
    description: "List of controllers to activate during EnableMotion."
  }
  controllers_to_deactivate: {
    type: string_array,
    default_value: [],
    description: "List of controllers to deactivate during EnableMotion."
  }

  operational_status_topic: {
    type: string,
    default_value: "",
    description: "[Optional] A topic that publishes an icon_hwm_controllers_msgs/msg/OperationalStatus message. That topic can cause and inhibit hardware module state transitions."
  }
  clear_faults_trigger_service: {
    type: string,
    default_value: "",
    description: "[Optional] An std_srvs/srv/Trigger service that clears any faults and potentially restarts the robot connection. This service must return true only if the ClearFaults operation was successful."
  }
  control_frequency_hz: {
    type: int,
    default_value: -1,
    description: "[Optional] The control frequency of the hardware module. If present, IconHwmController checks that this matches the update rate of the ControllerManager node, and reports an error if it doesn't. Values equal to or less than zero count as 'unset' and do nothing."
  }